services:
  - type: web
    name: edmotor-piloto
    runtime: docker
    plan: free
    region: virginia
    branch: edmotor-acceso-invitado
    rootDir: server
    healthCheckPath: /api/v1/health
    dockerCommand: /bin/sh /app/edmotor/pilot_start.sh
    envVars:
      - key: EDMOTOR_DATABASE_URL
        fromDatabase:
          name: edmotor-piloto-db
          property: connectionString
      - key: EDMOTOR_PILOT_OWNER_PASSWORD
        sync: false

databases:
  - name: edmotor-piloto-db
    databaseName: edmotor
    user: edmotor
    plan: free
    region: virginia
    ipAllowList: []
